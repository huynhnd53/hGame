<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121417" />
    <title>hGame</title>
    <style>
      :root {
        --bg: #121417;
        --card: #1b1e22;
        --line: rgba(255, 255, 255, 0.1);
        --ink: #eceae6;
        --muted: #9aa0a6;
        --accent: #e8734a;
        color-scheme: dark;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        place-content: center;
        padding: 32px 16px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 28px;
      }
      .lead {
        margin: 0 0 24px;
        color: var(--muted);
      }
      .apps {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 14px;
        max-width: 720px;
      }
      a.app {
        display: block;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
      }
      a.app:hover,
      a.app:focus-visible {
        border-color: var(--accent);
      }
      a.app h2 {
        margin: 0 0 6px;
        font-size: 18px;
      }
      a.app p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>hGame</h1>
      <p class="lead">Các dự án trong repo này.</p>
      <div class="apps">
        <a class="app" href="./vgang-online/">
          <h2>Vgang Online</h2>
          <p>Game 3D lái xe máy dạo phố về đêm, nhìn từ góc người lái.</p>
        </a>
        <a class="app" href="./newmap/">
          <h2>Dựng khu thật</h2>
          <p>Vẽ một khu trên bản đồ, dựng thành mô hình 3D từ OpenStreetMap và Open Buildings.</p>
        </a>
      </div>
    </main>
  </body>
</html>
