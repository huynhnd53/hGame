<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tilt Pad – điện thoại</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>
<script src="link.js"></script>
</head>
<body class="pad">
<style>
  [hidden] { display: none !important; }   /* style.css đặt display cho #live, phải ép ẩn */
  .top h1 { white-space: nowrap; }
  #games { display: flex; flex-direction: column; gap: .6rem; }
  #games button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; background: var(--surface);
    border: 2px solid var(--line); border-radius: 18px; padding: .8rem 1rem; }
  #games button b { font-size: 1.25rem; }
  #games button span { color: var(--muted); font-size: .95rem; }
  #games button.on { border-color: var(--ball); }
  #pick { flex: 1; }
  #hubBtn { display: block; margin: .6rem auto 0; }
</style>
<div>
  <div class="top">
    <h1 id="title">Điện thoại</h1>
    <span class="pill" id="padState">Chưa kết nối</span>
  </div>
  <div id="joinBox">
    <p class="muted">Nhập mã đang hiện trên màn hình máy tính</p>
    <div class="codein">
      <input id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
      <button class="primary" id="joinBtn">Kết nối</button>
    </div>
    <p class="muted hint" id="joinErr"></p>
    <p class="muted hint" id="checkLink" hidden><a href="check.html">Kiểm tra kết nối của máy này</a></p>
  </div>
</div>

<div id="pick" hidden>
  <p class="muted" style="margin-bottom:.6rem">Chọn game, màn hình máy tính sẽ chuyển theo:</p>
  <div id="games">
    <button data-g="fruit"><b>Chém hoa quả</b><span>Điện thoại là thanh kiếm, vung qua quả để chém.</span></button>
    <button data-g="pickle"><b>Pickleball</b><span>Điện thoại là cây vợt, vung đúng lúc để đánh.</span></button>
    <button data-g="cube"><b>Khối 3D</b><span>Xoay điện thoại, khối trên màn hình xoay theo.</span></button>
  </div>
</div>

<div id="live" hidden>
  <div class="readout">
    <div><span class="muted">alpha</span><b id="ra">0°</b></div>
    <div><span class="muted">beta</span><b id="rb">0°</b></div>
    <div><span class="muted">gamma</span><b id="rg">0°</b></div>
  </div>
  <p class="hint muted" id="liveHint">Xoay điện thoại thế nào, khối trên máy tính xoay thế ấy.</p>
</div>

<div id="controls" hidden>
  <button id="reset">ĐẶT LẠI GỐC</button>
  <p class="hint muted" id="resetHint">Giữ máy ở tư thế muốn làm “thẳng” rồi bấm.</p>
  <button class="ghost" id="hubBtn">Chọn game khác</button>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
let link = null;
let joined = false, code = "", game = "cube", rejoinUntil = 0, rejoinTimer = 0;

// Chữ theo game đang mở trên máy tính. Máy tính báo {t:"game"} khi điện thoại vào và {t:"switch"} khi chuyển game.
const TEXTS = {
  hub: { title: "Tay cầm", hint: "" },
  cube: { title: "Điện thoại", hint: "Xoay điện thoại thế nào, khối trên máy tính xoay thế ấy.", reset: "ĐẶT LẠI GỐC",
    resetHint: "Giữ máy ở tư thế muốn làm “thẳng” rồi bấm." },
  fruit: { title: "Thanh kiếm", hint: "Cầm như điều khiển TV, đầu máy chĩa vào màn hình. Vung nhanh qua quả để chém.",
    reset: "CĂN GIỮA", resetHint: "Chĩa đầu máy vào giữa màn hình máy tính rồi bấm." },
  pickle: { title: "Vợt pickleball", hint: "Cầm như cầm vợt, vung khi bóng tới: vung nhẹ bỏ nhỏ, vung mạnh đập, hất lên lốp.",
    reset: "CĂN GIỮA", resetHint: "Chĩa đầu máy vào màn hình máy tính rồi bấm." },
};
function applyGame(g) {
  if (!TEXTS[g]) return;
  game = g;
  const t = TEXTS[g];
  $("title").textContent = t.title;
  if (t.hint) $("liveHint").textContent = t.hint;
  if (t.reset) { $("reset").textContent = t.reset; $("resetHint").textContent = t.resetHint; }
  layout();
}
// Đang ở trang chọn game: hiện danh sách game thay cho bảng góc xoay.
function layout() {
  $("joinBox").hidden = joined || rejoinUntil > Date.now();
  $("pick").hidden = !joined || game !== "hub";
  $("live").hidden = !joined || game === "hub";
  $("controls").hidden = !joined || game === "hub";
}

const params = new URLSearchParams(location.search);
if (params.get("c")) $("codeIn").value = params.get("c").toUpperCase();
applyGame(params.get("game") || "cube");
$("joinBtn").onclick = join;
$("codeIn").addEventListener("keydown", e => { if (e.key === "Enter") join(); });
for (const b of document.querySelectorAll("#games button")) b.onclick = () => { if (joined) link.send({ t: "pick", game: b.dataset.g }); };
$("hubBtn").onclick = () => { if (joined) link.send({ t: "pick", game: "hub" }); };

async function join(){
  const c = $("codeIn").value.trim().toUpperCase();
  $("joinErr").textContent = "";
  if (!/^[A-Z]{4}$/.test(c)) { $("joinErr").textContent = "Mã gồm 4 chữ cái."; return; }
  $("joinBtn").disabled = true;

  // iOS 13+: xin quyền ngay trong thao tác chạm, và chỉ hoạt động trên HTTPS
  const ok = await askMotionPermission();
  if (!ok) { $("joinErr").textContent = "Không được cấp quyền cảm biến. Cần mở trang qua HTTPS và bấm Cho phép."; $("joinBtn").disabled = false; return; }
  code = c;
  connect();
}

function connect() {
  $("joinErr").textContent = rejoinUntil > Date.now() ? "" : "Đang kết nối…";
  if (link) link.close();
  link = TiltLink.joinPad(code, {
    onOpen(mode) {
      joined = true; rejoinUntil = 0;
      $("joinErr").textContent = "";
      $("padState").textContent = "Phòng " + code + (mode === "relay" ? " · qua trung gian" : " · trực tiếp");
      layout();
      setTimeout(() => { if (!got && game !== "hub") $("joinErr").textContent = "Chưa nhận được dữ liệu cảm biến – kiểm tra lại HTTPS."; }, 2000);
    },
    onClosed() {
      // Máy tính chuyển game hoặc tải lại trang: chờ phòng mở lại rồi tự nối, khỏi nhập mã.
      if (!joined) return;
      joined = false;
      if (!rejoinUntil) rejoinUntil = Date.now() + 30000;
      $("padState").textContent = "Màn hình đã đóng · đang chờ mở lại…";
      layout();
      clearTimeout(rejoinTimer); rejoinTimer = setTimeout(connect, 1200);
    },
    onMessage(msg) {
      if (msg.t === "buzz" && navigator.vibrate) navigator.vibrate(Math.min(400, Number(msg.ms) || 30));
      if (msg.t === "game") applyGame(msg.game);
      if (msg.t === "switch") { rejoinUntil = Date.now() + 30000; applyGame(msg.game); $("padState").textContent = "Đang chuyển game…"; }
    },
    onError(text) {
      if (rejoinUntil > Date.now()) { clearTimeout(rejoinTimer); rejoinTimer = setTimeout(connect, 1500); return; }
      if (rejoinUntil) { rejoinUntil = 0; $("padState").textContent = "Màn hình đã đóng"; layout(); }
      $("joinErr").textContent = text; $("joinBtn").disabled = false; $("checkLink").hidden = false;
    },
  });
}

let motionOn = false;
async function askMotionPermission(){
  if (motionOn) return true;
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      if ((await DeviceOrientationEvent.requestPermission()) !== "granted") return false;
    }
  } catch (e) { return false; }
  addEventListener("deviceorientation", onOrient, true);
  motionOn = true;
  return true;
}

let got = false, lastSend = 0;
function onOrient(e){
  if (e.alpha == null || e.beta == null || e.gamma == null) return;
  got = true;
  $("ra").textContent = e.alpha.toFixed(0) + "°";
  $("rb").textContent = e.beta.toFixed(0) + "°";
  $("rg").textContent = e.gamma.toFixed(0) + "°";
  if (!joined || game === "hub") return;
  const now = performance.now();
  if (now - lastSend < 16) return;              // ~60 lần/giây
  lastSend = now;
  const o = (screen.orientation && screen.orientation.angle) ?? (window.orientation || 0);
  // ts: giờ trên điện thoại, để máy tính tính tốc độ vung không bị lệch vì mạng chậm/nhanh thất thường.
  link.send({ t: "orient", a: +e.alpha.toFixed(2), b: +e.beta.toFixed(2), g: +e.gamma.toFixed(2), o, ts: Math.round(now) });
}

$("reset").onclick = () => { if (joined) { link.send({ t: "reset" }); if (navigator.vibrate) navigator.vibrate(30); } };
if (params.has("debug")) window.__pad = { get game() { return game; }, get joined() { return joined; } };
})();
</script>
</body>
</html>
